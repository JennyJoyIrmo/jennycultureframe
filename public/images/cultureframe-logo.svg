<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="40" cy="40" r="35" fill="#059669" stroke="#10b981" stroke-width="2"/>
  
  <!-- Heritage Symbol (Temple/Monument) -->
  <g transform="translate(20, 20)">
    <!-- Base -->
    <rect x="5" y="35" width="30" height="4" fill="#ffffff"/>
    <!-- Columns -->
    <rect x="8" y="20" width="3" height="15" fill="#ffffff"/>
    <rect x="14" y="20" width="3" height="15" fill="#ffffff"/>
    <rect x="20" y="20" width="3" height="15" fill="#ffffff"/>
    <rect x="26" y="20" width="3" height="15" fill="#ffffff"/>
    <!-- Top -->
    <rect x="6" y="17" width="28" height="3" fill="#ffffff"/>
    <!-- Roof -->
    <polygon points="5,17 35,17 20,10" fill="#ffffff"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="25" cy="25" r="2" fill="#10b981" opacity="0.7"/>
  <circle cx="55" cy="35" r="1.5" fill="#10b981" opacity="0.5"/>
  <circle cx="30" cy="55" r="1" fill="#10b981" opacity="0.6"/>
  
  <!-- Text -->
  <text x="90" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#059669">
    CultureFrame
  </text>
  <text x="90" y="50" font-family="Arial, sans-serif" font-size="10" fill="#6b7280">
    Mansalay Heritage Platform
  </text>
  
  <!-- Decorative Line -->
  <line x1="90" y1="55" x2="190" y2="55" stroke="#10b981" stroke-width="1" opacity="0.5"/>
</svg>